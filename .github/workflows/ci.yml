name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # -------------------------------------------------------------------------
  # Tests backend Python
  # -------------------------------------------------------------------------
  backend:
    name: Backend — tests Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'import du module principal
        run: python -c "from app.main import app; print('Import OK')"

      - name: Lancer les tests
        run: python -m pytest tests/ -v --tb=short

  # -------------------------------------------------------------------------
  # Vérification TypeScript frontend
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier TypeScript (0 erreur)
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build

  # -------------------------------------------------------------------------
  # Construction de l'image Docker (sans push, sauf sur main)
  # -------------------------------------------------------------------------
  docker:
    name: Docker — build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: si-classification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
